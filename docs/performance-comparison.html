<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LightTTS measurements</title>
<style>
html, body { margin: 0; background: transparent; color: var(--foreground); font-family: var(--font-sans); }
#lighttts-measured-comparison { display: grid; gap: 16px; }
#lighttts-measured-comparison h3 { font-weight: 500; margin: 0 0 8px; }
#lighttts-measured-comparison svg { width: 100%; height: 140px; display: block; }
#lighttts-measured-comparison svg text { fill: var(--foreground); font-size: 12px; font-weight: 400; }
#lighttts-measured-comparison .axis { stroke: var(--border); stroke-width: 1; }
#lighttts-measured-comparison .note { color: var(--muted-foreground); margin: 0; }
</style>
</head>
<body>
<div id="lighttts-measured-comparison">
  <section>
    <h3>Installed bundle · models excluded</h3>
    <svg role="img" aria-label="Bundle size: LightTTS 44.82 MiB; SuperWhisper 136.89 MiB" data-chart="disk"></svg>
  </section>
  <section>
    <h3>Stop-to-text median · three trials</h3>
    <svg role="img" aria-label="Stop release to text median: LightTTS 268 milliseconds; SuperWhisper 461 milliseconds. Different selected models." data-chart="latency"></svg>
  </section>
  <p class="note">Apple M1 Max · AC power. LightTTS: Parakeet v3. SuperWhisper: Whisper Large v3 Turbo. Different models; small sample; both misheard the name sentence.</p>
</div>
<script>
(() => {
  const root = document.getElementById('lighttts-measured-comparison');
  const datasets = {
    disk: { values: [44.82, 136.89], unit: 'MiB', step: 50, digits: 2 },
    latency: { values: [268.1, 460.9], unit: 'ms', step: 250, digits: 0 }
  };
  const names = ['LightTTS', 'SuperWhisper'];
  const ns = 'http://www.w3.org/2000/svg';
  function draw() {
    root.querySelectorAll('svg[data-chart]').forEach(svg => {
      const data = datasets[svg.dataset.chart];
      const width = svg.clientWidth;
      if (!width) return;
      const maximum = Math.ceil(Math.max(...data.values) / data.step) * data.step;
      svg.setAttribute('viewBox', `0 0 ${width} 140`);
      svg.replaceChildren();
      function add(tag, attributes, text) {
        const element = document.createElementNS(ns, tag);
        Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, value));
        if (text !== undefined) element.textContent = text;
        svg.appendChild(element);
      }
      data.values.forEach((value, index) => {
        const y = 15 + index * 46;
        add('text', { x: 0, y }, names[index]);
        add('text', { x: width - 1, y, 'text-anchor': 'end' }, `${value.toFixed(data.digits)} ${data.unit}`);
        add('rect', { x: 0, y: y + 7, width: value / maximum * width, height: 14, fill: `var(--chart-${index + 1})` });
      });
      add('line', { x1: 0, x2: width, y1: 111, y2: 111, class: 'axis' });
      [0, maximum / 2, maximum].forEach((value, index) => {
        const x = value / maximum * (width - 2) + 1;
        add('line', { x1: x, x2: x, y1: 111, y2: 115, class: 'axis' });
        add('text', { x, y: 133, 'text-anchor': index === 0 ? 'start' : index === 2 ? 'end' : 'middle' }, `${value} ${data.unit}`);
      });
    });
  }
  new ResizeObserver(draw).observe(root);
  draw();
})();
</script>
</body>
</html>
